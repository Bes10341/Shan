<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
  <title>LP7-B2F 停車位互動導航圖</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0f172a;
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-cad {
      font-family: 'Chivo Mono', monospace;
    }

    /* SVG Blueprint elements styling */
    .cad-bg {
      fill: #ffffff;
    }

    /* 停車格線 */
    .slot-rect {
      fill: #ffffff;
      stroke: #1e293b;
      stroke-width: 1.2;
      cursor: pointer;
      transition: fill 0.15s ease, stroke-width 0.15s ease;
    }
    .slot-rect:hover {
      fill: #f1f5f9;
    }

    /* 車位號文字 */
    .slot-text {
      font-family: 'Chivo Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      fill: #0f172a;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 實心結構柱子 (深黑灰底白字) */
    .pillar-rect {
      fill: #475569;
      stroke: #0f172a;
      stroke-width: 1.2;
    }
    .pillar-text {
      font-family: 'Chivo Mono', monospace;
      font-weight: 800;
      font-size: 8.5px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 灰色機房設備 */
    .room-machine {
      fill: #788599;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
    .room-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 800;
      font-size: 14px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.1em;
    }

    /* 天井 (Lightwell) */
    .room-lightwell {
      fill: #f8fafc;
      stroke: #334155;
      stroke-width: 1.5;
    }
    .lightwell-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 800;
      font-size: 14px;
      fill: #334155;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.25em;
    }

    /* 換鞋區出入口 / 梯廳 */
    .room-entrance {
      fill: #ffffff;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
    .entrance-text-main {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 800;
      font-size: 13px;
      fill: #0f172a;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .entrance-text-sub {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 600;
      font-size: 9.5px;
      fill: #475569;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 往 B1F 車道 */
    .room-driveway {
      fill: #e2e8f0;
      stroke: #334155;
      stroke-width: 1.2;
    }
    .driveway-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 800;
      font-size: 12px;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 空車位（匹配到輸入清單）高亮脈衝動畫 */
    @keyframes pulse-emerald-svg {
      0%, 100% {
        fill: #10b981;
        stroke: #047857;
        stroke-width: 2.2;
      }
      50% {
        fill: #34d399;
        stroke: #059669;
        stroke-width: 3.5;
      }
    }

    .slot-free-rect {
      animation: pulse-emerald-svg 1.8s infinite ease-in-out;
      cursor: pointer;
    }
    .slot-free-text {
      fill: #ffffff !important;
      font-weight: 900 !important;
      font-size: 12px !important;
    }

    /* 定位聚焦動效 */
    @keyframes target-glow {
      0%, 100% {
        stroke: #f59e0b;
        stroke-width: 4;
      }
      50% {
        stroke: #fbbf24;
        stroke-width: 6;
      }
    }
    .slot-targeted {
      animation: target-glow 0.8s infinite ease-in-out !important;
    }
  </style>
</head>

  <!-- Interactive JavaScript Logic -->
  <script>
    // State Store
    let activeSpots = {};
    let excludedSpots = [];
    let curResvSpot = null;
    let tourIndex = 0;

    // Viewport transform
    let scale = 0.72;
    let posX = 0;
    let posY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let touchDistance = 0;
    let touchScale = 0.72;

    const viewport = document.getElementById('viewport');
    const mapStage = document.getElementById('mapStage');

    function applyTransform() {
      mapStage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    // Touch events for mobile pan and pinch-zoom
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchScale = scale;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        applyTransform();
      } else if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchDistance > 0) {
          scale = Math.min(Math.max(0.35, touchScale * (dist / touchDistance)), 3.0);
          applyTransform();
        }
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) isDragging = false;
    });

    // Mouse drag for desktop
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.35, scale * zoomFactor), 3.0);
      applyTransform();
    }, { passive: false });

    // Zoom Buttons
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      scale = Math.min(3.0, scale + 0.2);
      applyTransform();
    });
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      scale = Math.max(0.35, scale - 0.2);
      applyTransform();
    });
    document.getElementById('btnZoomReset').addEventListener('click', () => {
      scale = 0.72;
      posX = 0;
      posY = 0;
      applyTransform();
    });
    document.getElementById('btnFitScreen').addEventListener('click', fitMapToScreen);

    function fitMapToScreen() {
      const vWidth = viewport.clientWidth;
      scale = Math.max(0.35, Math.min(1.1, (vWidth - 32) / 960));
      posX = 0;
      posY = 0;
      applyTransform();
    }

    // Parsing string logic
    function parseParkingInput(rawText) {
      activeSpots = {};
      excludedSpots = [];

      const lines = rawText.trim().split('\n');
      const headerLine = lines[0].trim();
      if (headerLine && !headerLine.startsWith('Pos:')) {
        document.getElementById('labelBatchDate').innerText = headerLine;
      }

      const chunks = rawText.split(/(?=Pos:)/gi);

      chunks.forEach(chunk => {
        const str = chunk.trim();
        if (!str.startsWith('Pos:')) return;

        const posMatch = str.match(/Pos:([A-Za-z0-9\-]+)/i);
        if (!posMatch) return;

        const posId = posMatch[1].trim();
        const depMatch = str.match(/\(Dep:([^)]+)\)/i);
        const gridMatch = str.match(/\(([A-Z0-9\-_]+(?:__[A-Z0-9\-_]+)?)\)/i);

        const dep = depMatch ? depMatch[1].trim() : '無註記';
        const grid = gridMatch ? gridMatch[1].trim() : '-';

        // Filter: Only include LP7-B2F-*
        if (posId.toUpperCase().startsWith('LP7-B2F-')) {
          const num = posId.split('-')[2];
          activeSpots[num] = {
            id: num,
            fullPos: posId,
            dept: dep,
            grid: grid,
            clipboardCode: `${num}-QQ`
          };
        } else {
          excludedSpots.push(posId);
        }
      });

      renderActiveSpots();
      renderDrawerList();
      updateExcludedNotice();
    }

    function renderActiveSpots() {
      const groups = document.querySelectorAll('.slot-group');
      let count = 0;

      groups.forEach(grp => {
        const id = grp.getAttribute('data-id');
        const rect = grp.querySelector('.slot-rect');
        const text = grp.querySelector('.slot-text');

        rect.classList.remove('slot-free-rect');
        if (text) text.classList.remove('slot-free-text');

        if (activeSpots[id]) {
          rect.classList.add('slot-free-rect');
          if (text) text.classList.add('slot-free-text');
          count++;
        }
      });

      document.getElementById('badgeAvailableCount').innerText = `${count} 空位`;
      document.getElementById('statCountText').innerText = count;
    }

    function updateExcludedNotice() {
      const notice = document.getElementById('filterStatsBox');
      if (excludedSpots.length > 0) {
        notice.innerHTML = `已過濾非 LP7-B2F 車位 (${excludedSpots.length} 個)：<br><span class="font-cad text-amber-200">${excludedSpots.join(', ')}</span>`;
      } else {
        notice.innerText = '所有輸入車位皆屬於 LP7-B2F 樓層。';
      }
    }

    // Reservation click event
    document.addEventListener('click', (e) => {
      const group = e.target.closest('.slot-group');
      if (!group) return;

      const spotId = group.getAttribute('data-id');
      const spotInfo = activeSpots[spotId];

      if (spotInfo) {
        openReservationModal(spotInfo);
      } else {
        showToast(`車位 #${spotId} 目前未釋出`, 'info');
      }
    });

    const modalResv = document.getElementById('modalReservation');
    const cardResv = document.getElementById('cardReservation');

    function openReservationModal(spot) {
      curResvSpot = spot;
      document.getElementById('resvSpotId').innerText = `#${spot.id}`;
      document.getElementById('resvDepName').innerText = spot.dept;
      document.getElementById('resvGridCode').innerText = spot.grid;
      document.getElementById('resvCopySnippet').innerText = spot.clipboardCode;

      modalResv.classList.remove('hidden');
      setTimeout(() => {
        cardResv.classList.remove('scale-95', 'opacity-0');
        cardResv.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeReservationModal() {
      cardResv.classList.remove('scale-100', 'opacity-100');
      cardResv.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modalResv.classList.add('hidden');
        curResvSpot = null;
      }, 200);
    }

    document.getElementById('btnDismissResv').addEventListener('click', closeReservationModal);
    document.getElementById('btnCancelResv').addEventListener('click', closeReservationModal);

    // Confirm Reservation -> Copy [SpotNum]-QQ to Clipboard & show Toast
    document.getElementById('btnConfirmResv').addEventListener('click', () => {
      if (!curResvSpot) return;

      const code = curResvSpot.clipboardCode; // e.g. 627-QQ, 792-QQ

      copyToClipboard(code, () => {
        closeReservationModal();
        showToast('已複製到剪貼簿，請至LINE進行貼上');
      });
    });

    function copyToClipboard(text, callback) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => {
            if (callback) callback();
          })
          .catch(() => {
            legacyCopy(text, callback);
          });
      } else {
        legacyCopy(text, callback);
      }
    }

    function legacyCopy(text, callback) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        if (callback) callback();
      } catch (err) {
        showToast('複製失敗，代碼：' + text, 'warn');
      }
      document.body.removeChild(el);
    }

    // Toast alert
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toastAlert');
      const text = document.getElementById('toastAlertText');

      text.innerText = msg;

      if (type === 'warn' || type === 'info') {
        toast.className = 'fixed top-14 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white border border-slate-600 font-bold px-4 py-2.5 rounded-xl shadow-2xl text-xs z-50 flex items-center gap-2 pointer-events-none opacity-0 transition-all duration-300 scale-90';
      } else {
        toast.className = 'fixed top-14 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-2xl text-xs z-50 flex items-center gap-2 pointer-events-none opacity-0 transition-all duration-300 scale-90';
      }

      toast.classList.remove('opacity-0', 'scale-90');
      toast.classList.add('opacity-100', 'scale-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'scale-100');
        toast.classList.add('opacity-0', 'scale-90');
      }, 3500);
    }

    // Center on spot
    function centerOnSpot(id) {
      const target = document.querySelector(`.slot-group[data-id="${id}"] .slot-rect`);
      if (!target) return;

      document.querySelectorAll('.slot-targeted').forEach(el => el.classList.remove('slot-targeted'));
      target.classList.add('slot-targeted');

      const rect = target.getBoundingClientRect();
      const viewRect = viewport.getBoundingClientRect();

      posX += (viewRect.left + viewRect.width / 2) - (rect.left + rect.width / 2);
      posY += (viewRect.top + viewRect.height / 2) - (rect.top + rect.height / 2);
      applyTransform();

      setTimeout(() => {
        target.classList.remove('slot-targeted');
      }, 3500);
    }

    // Tour Spots
    document.getElementById('btnTourQuick').addEventListener('click', () => {
      const keys = Object.keys(activeSpots);
      if (keys.length === 0) {
        showToast('目前無 LP7-B2F 可用車位', 'warn');
        return;
      }
      const spotId = keys[tourIndex % keys.length];
      tourIndex++;
      centerOnSpot(spotId);
      showToast(`已移動至車位 #${spotId}`, 'info');
    });

    // Drawer List
    function renderDrawerList() {
      const list = document.getElementById('drawerListContainer');
      list.innerHTML = '';

      const spots = Object.values(activeSpots);
      if (spots.length === 0) {
        list.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">無可預約空位</div>';
        return;
      }

      spots.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 hover:border-emerald-500 p-2.5 rounded-xl cursor-pointer flex items-center justify-between active:scale-95 transition";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-cad font-bold text-white text-sm">#${item.id}</span>
              <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-bold">空位</span>
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-cad">
              ${item.dept} • ${item.grid}
            </div>
          </div>
          <button class="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px]">
            預約
          </button>
        `;

        card.addEventListener('click', () => {
          closeDrawer();
          centerOnSpot(item.id);
          openReservationModal(item);
        });

        list.appendChild(card);
      });
    }

    // Drawer toggles
    const drawer = document.getElementById('drawerList');
    function closeDrawer() {
      drawer.classList.add('translate-x-full');
    }
    document.getElementById('btnOpenDrawer').addEventListener('click', () => {
      drawer.classList.remove('translate-x-full');
    });
    document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);

    // Modal Input toggles
    const modalInput = document.getElementById('modalInput');
    const rawInputText = document.getElementById('rawInputText');

    function openInputModal() {
      modalInput.classList.remove('hidden');
    }
    function closeInputModal() {
      modalInput.classList.add('hidden');
    }

    document.getElementById('btnOpenInputModal').addEventListener('click', openInputModal);
    document.getElementById('btnFloatingInputTrigger').addEventListener('click', openInputModal);
    document.getElementById('btnDismissInput').addEventListener('click', closeInputModal);
    document.getElementById('btnClearInput').addEventListener('click', () => {
      rawInputText.value = '';
    });

    document.getElementById('btnSubmitParse').addEventListener('click', () => {
      parseParkingInput(rawInputText.value);
      closeInputModal();
      showToast('已更新車位地圖');
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      parseParkingInput(rawInputText.value);

      setTimeout(() => {
        fitMapToScreen();
      }, 50);
    });
  </script>
</body>
</html>
