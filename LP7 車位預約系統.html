<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>LP7-B2F 智慧車位導航系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(16, 24, 40, 0.85);
      --neon-green: #10b981;
      --neon-cyan: #06b6d4;
      --neon-accent: #3b82f6;
    }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: pan-x pan-y pinch-zoom;
      overflow: hidden;
    }
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .blueprint-svg {
      user-select: none;
      -webkit-user-select: none;
    }
    /* 車位樣式 */
    .slot-normal {
      fill: #151f30;
      stroke: #2a3b5c;
      stroke-width: 1.2;
      transition: all 0.25s ease;
    }
    .slot-normal text {
      fill: #64748b;
      font-size: 11px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    /* 亮起的空車位 */
    .slot-available {
      fill: #064e3b !important;
      stroke: #34d399 !important;
      stroke-width: 2 !important;
      cursor: pointer;
      filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.65));
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }
    .slot-available text {
      fill: #a7f3d0 !important;
      font-weight: 800 !important;
      font-size: 12px !important;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }
    @keyframes pulseGlow {
      0% {
        fill: #064e3b;
        stroke: #34d399;
        filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.4));
      }
      100% {
        fill: #047857;
        stroke: #6ee7b7;
        filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.9));
      }
    }
    /* 建築柱子 */
    .pillar-box {
      fill: #090d16;
      stroke: #38bdf8;
      stroke-width: 1.2;
    }
    .pillar-text {
      fill: #38bdf8;
      font-size: 9px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      font-family: monospace;
      pointer-events: none;
    }
    /* 機房與設備區 */
    .area-facility {
      fill: #111827;
      stroke: #374151;
      stroke-width: 1.5;
    }
    .area-shaft {
      fill: #0b1329;
      stroke: #1e3a8a;
      stroke-dasharray: 4,4;
      stroke-width: 1.2;
    }
    .area-text {
      fill: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 1px;
    }
    .road-lane {
      fill: #090f1d;
      stroke: #1d4ed8;
      stroke-dasharray: 6,4;
      stroke-width: 1.5;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col select-none">

      <button onclick="zoomBy(1.25)" class="w-10 h-10 rounded-xl glass-panel text-cyan-300 font-bold text-lg flex items-center justify-center hover:bg-cyan-500/20 active:scale-95 shadow-lg border border-cyan-500/30">
        +
      </button>
      <button onclick="resetZoom()" class="w-10 h-10 rounded-xl glass-panel text-slate-300 text-xs font-mono flex items-center justify-center hover:bg-white/10 active:scale-95 shadow-lg border border-white/10">
        1x
      </button>
      <button onclick="zoomBy(0.8)" class="w-10 h-10 rounded-xl glass-panel text-cyan-300 font-bold text-lg flex items-center justify-center hover:bg-cyan-500/20 active:scale-95 shadow-lg border border-cyan-500/30">
        -
      </button>
      <button onclick="fitView()" class="w-10 h-10 rounded-xl glass-panel text-emerald-400 text-xs flex items-center justify-center hover:bg-emerald-500/20 active:scale-95 shadow-lg border border-emerald-500/30" title="適應螢幕">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- 底部即時狀態列與巡覽工具 -->
  <footer class="glass-panel px-4 py-2 flex items-center justify-between z-30 border-t border-cyan-500/20">
    <div class="flex items-center space-x-2">
      <div class="flex items-center space-x-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs text-slate-300">綠色 = 可預約空位</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="cycleNextSlot()" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-cyan-400 text-xs border border-cyan-500/30 font-medium active:scale-95 transition-all">
        快速巡覽 ➔
      </button>
    </div>
  </footer>

  <!-- =================== 彈出視窗 1：字串輸入 Modal =================== -->
  <div id="inputModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="glass-panel w-full max-w-md rounded-2xl p-5 border border-cyan-500/40 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
        <div class="flex items-center space-x-2">
          <div class="w-2 h-4 bg-cyan-400 rounded-sm"></div>
          <h3 class="text-base font-bold text-white tracking-wide">貼上車位字串</h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 text-lg leading-none">✕</button>
      </div>

      <p class="text-xs text-slate-400 my-3">
        直接貼上系統分配字串，將自動過濾並僅高亮呈現屬於 <span class="text-emerald-400 font-bold">LP7-B2F</span> 的空車位：
      </p>

      <textarea id="rawStringInput" rows="7" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 leading-relaxed resize-none"></textarea>

      <div class="mt-4 flex space-x-3">
        <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition-all">
          取消
        </button>
        <button onclick="handleParseAndApply()" class="flex-1 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-900/50 hover:opacity-95 active:scale-95 transition-all">
          解析並更新地圖
        </button>
      </div>
    </div>
  </div>

  <!-- =================== 彈出視窗 2：預約確認 Dialog =================== -->
  <div id="bookingModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="glass-panel w-full max-w-sm rounded-2xl p-6 border border-emerald-500/50 shadow-2xl text-center transform scale-95 transition-transform duration-200" id="bookingBox">
      <div class="w-12 h-12 rounded-full bg-emerald-500/20 border border-emerald-400/40 mx-auto flex items-center justify-center mb-3">
        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>

      <h3 class="text-lg font-bold text-white mb-1">是否預約此車位？</h3>
      <p class="text-xs text-slate-400 mb-4">確認後將自動複製預約代碼至剪貼簿</p>

      <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800 text-left mb-5 space-y-1.5 text-xs font-mono">
        <div class="flex justify-between">
          <span class="text-slate-500">樓層車位：</span>
          <span class="text-emerald-400 font-bold" id="bookSlotName">LP7-B2F-678</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">分配部門：</span>
          <span class="text-slate-300" id="bookSlotDep">--</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">柱位坐標：</span>
          <span class="text-slate-300" id="bookSlotCoord">--</span>
        </div>
        <div class="flex justify-between pt-1 border-t border-slate-800">
          <span class="text-slate-500">複製格式：</span>
          <span class="text-cyan-400 font-bold" id="bookCopyFormat">678-QQ</span>
        </div>
      </div>

      <div class="flex space-x-3">
        <button onclick="closeBookingModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium">
          取消
        </button>
        <button onclick="confirmBooking()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-bold text-xs shadow-lg shadow-emerald-900/50 hover:opacity-95 active:scale-95 transition-all">
          是，立即預約
        </button>
      </div>
    </div>
  </div>

  <script>
    // 預設字串
    const defaultDataString = `9/25 Day 
Pos:LP7-B2F-573
  (Dep:LPRDA1)
  (F-20__F-19)
Pos:LP7-B2F-575
  (Dep:LPRD13)
  (G-20__G-19)
Pos:LP7-B2F-620
  (Dep:LPRD31)
  (J-13__J-12)
Pos:LP7-B2F-627
  (Dep:LPRD51)
  (J-16__J-15)
Pos:LP7-B2F-630
  (Dep:LPRD71)
  (J-17__J-16)
Pos:LP7-B2F-631
  (Dep:LPRD81)
  (J-17__J-16)
Pos:LP7-B2F-717
  (Dep:LPRD31)
  (N-18__N-17)
Pos:LP7-B2F-754
  (Dep:LPRD51)
  (M-18__M-17)
Pos:LP7-B2F-773
  (Dep:LPRD62)
  (K-13__K-12)
Pos:LP7-B2F-849
  (Dep:LPRD61)
  (H-17__H-16)
Pos:LP7-1F-886
  (Dep:LPRDB1)
  (J-10__J-11)
Pos:LP7-B2F-712
  (Dep:LPRD13)
  (M-19__N-19)
Pos:LP5-B1F-117
  (Dep:LPRDB5)
  (G-05__G-04)
Pos:LP5-B1F-137
  (Dep:LPRDC1)
  (F-09__F-09)
Pos:LP5-B1F-162
  (Dep:LPRD47)
  (E-05__E-04)
Pos:LP5-B1F-208
  (Dep:LPRD46)
  (C-04__C-03)
Pos:LP5-B1F-019
  (Dep:LPRDC2)
  (L-06__L-05)
Pos:LP7-B2F-792
  (Dep:LPRD51)
  (J-02)
Pos:LP7-1F-873
  (Dep:LPRD41)
  (K-11__K-09)`;

    // 系統狀態
    let availableSlotsMap = new Map();
    let currentPendingSlot = null;
    let cycleIndex = 0;

    // 平移縮放狀態
    let scale = 0.55;
    let pointX = 20;
    let pointY = 20;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    // DOM 元素
    const container = document.getElementById('viewportContainer');
    const wrapper = document.getElementById('mapWrapper');
    const rawInput = document.getElementById('rawStringInput');
    const inputModal = document.getElementById('inputModal');
    const modalBox = document.getElementById('modalBox');
    const bookingModal = document.getElementById('bookingModal');
    const bookingBox = document.getElementById('bookingBox');

    // 解析字串核心
    function parseParkingString(str) {
      const b2fMap = new Map();
      const lines = str.split('\n');
      let currentPos = null;
      let currentDep = '';
      let currentCoord = '';

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('Pos:')) {
          if (currentPos && currentPos.startsWith('LP7-B2F-')) {
            const num = currentPos.replace('LP7-B2F-', '').trim();
            b2fMap.set(num, { id: num, fullPos: currentPos, dep: currentDep, coord: currentCoord });
          }
          currentPos = line.replace('Pos:', '').trim();
          currentDep = '';
          currentCoord = '';
        } else if (line.startsWith('(Dep:')) {
          currentDep = line.replace('(Dep:', '').replace(')', '').trim();
        } else if (line.startsWith('(') && line.endsWith(')')) {
          currentCoord = line.replace(/^\(/, '').replace(/\)$/, '').trim();
        }
      }
      if (currentPos && currentPos.startsWith('LP7-B2F-')) {
        const num = currentPos.replace('LP7-B2F-', '').trim();
        b2fMap.set(num, { id: num, fullPos: currentPos, dep: currentDep, coord: currentCoord });
      }
      return b2fMap;
    }

    // 渲染亮起
    function applyHighlightedSlots() {
      // 重置所有車位
      document.querySelectorAll('.slot-group').forEach(el => {
        el.classList.remove('slot-available');
        el.onclick = null;
      });

      // 為有效車位綁定事件與高亮
      let matchedCount = 0;
      availableSlotsMap.forEach((info, id) => {
        const target = document.querySelector(`.slot-group[data-id="${id}"]`);
        if (target) {
          target.classList.add('slot-available');
          target.onclick = (e) => {
            e.stopPropagation();
            openBookingDialog(info);
          };
          matchedCount++;
        }
      });

      document.getElementById('availCountBadge').textContent = `${matchedCount} 空位`;
    }

    // 更新地圖
    function handleParseAndApply() {
      const text = rawInput.value.trim();
      if (!text) return;
      availableSlotsMap = parseParkingString(text);
      applyHighlightedSlots();
      closeModal();
      showToast('已更新車位狀態');
    }

    // 預約彈窗
    function openBookingDialog(info) {
      currentPendingSlot = info;
      document.getElementById('bookSlotName').textContent = `LP7-B2F-${info.id}`;
      document.getElementById('bookSlotDep').textContent = info.dep || '未指定';
      document.getElementById('bookSlotCoord').textContent = info.coord || '未指定';
      document.getElementById('bookCopyFormat').textContent = `${info.id}-QQ`;

      bookingModal.classList.remove('hidden');
      setTimeout(() => {
        bookingModal.classList.remove('opacity-0');
        bookingBox.classList.remove('scale-95');
      }, 10);
    }

    function closeBookingModal() {
      bookingModal.classList.add('opacity-0');
      bookingBox.classList.add('scale-95');
      setTimeout(() => {
        bookingModal.classList.add('hidden');
        currentPendingSlot = null;
      }, 200);
    }

    // 點擊「是」：複製到剪貼簿並彈出 Toast
    function confirmBooking() {
      if (!currentPendingSlot) return;
      const copyText = `${currentPendingSlot.id}-QQ`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(() => {
          triggerSuccessFeedback();
        }).catch(() => {
          fallbackCopyText(copyText);
        });
      } else {
        fallbackCopyText(copyText);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        triggerSuccessFeedback();
      } catch (err) {
        alert("複製失敗，請手動複製: " + text);
      }
      document.body.removeChild(textArea);
    }

    function triggerSuccessFeedback() {
      closeBookingModal();
      showToast('已複製到剪貼簿，請至LINE進行貼上');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-6');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-6');
      }, 2600);
    }

    // 視圖變換與縮放
    function updateTransform() {
      wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function zoomBy(factor) {
      const oldScale = scale;
      scale = Math.min(Math.max(0.3, scale * factor), 2.5);
      // 以中心點縮放
      const cx = container.clientWidth / 2;
      const cy = container.clientHeight / 2;
      pointX = cx - (cx - pointX) * (scale / oldScale);
      pointY = cy - (cy - pointY) * (scale / oldScale);
      updateTransform();
    }

    function resetZoom() {
      scale = 1.0;
      pointX = 20;
      pointY = 20;
      updateTransform();
    }

    function fitView() {
      const containerW = container.clientWidth;
      const containerH = container.clientHeight;
      const mapW = 1020;
      const mapH = 1520;
      scale = Math.min(containerW / mapW, containerH / mapH) * 0.95;
      pointX = (containerW - mapW * scale) / 2;
      pointY = (containerH - mapH * scale) / 2;
      updateTransform();
    }

    // 循序跳轉至下一個空車位
    function cycleNextSlot() {
      const keys = Array.from(availableSlotsMap.keys());
      if (keys.length === 0) return;
      const slotId = keys[cycleIndex % keys.length];
      cycleIndex++;

      const target = document.querySelector(`.slot-group[data-id="${slotId}"]`);
      if (target) {
        const bbox = target.getBBox();
        scale = 1.2;
        pointX = container.clientWidth / 2 - (bbox.x + bbox.width / 2) * scale;
        pointY = container.clientHeight / 2 - (bbox.y + bbox.height / 2) * scale;
        updateTransform();
      }
    }

    // 拖曳平移事件 (滑鼠與觸控)
    container.addEventListener('mousedown', (e) => {
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // 觸控手勢支援 (單指拖曳 & 雙指縮放)
    let initialTouchDist = 0;
    let initialScale = 1;

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPanning) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (initialTouchDist > 0) {
          const factor = currentDist / initialTouchDist;
          scale = Math.min(Math.max(0.3, initialScale * factor), 2.5);
          updateTransform();
        }
      }
    }, { passive: true });

    container.addEventListener('touchend', () => { isPanning = false; });

    // 字串輸入 Modal 控制
    function openModal() {
      inputModal.classList.remove('hidden');
      setTimeout(() => {
        inputModal.classList.remove('opacity-0');
        modalBox.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      inputModal.classList.add('opacity-0');
      modalBox.classList.add('scale-95');
      setTimeout(() => {
        inputModal.classList.add('hidden');
      }, 200);
    }

    // 初始化載入
    window.addEventListener('DOMContentLoaded', () => {
      rawInput.value = defaultDataString;
      availableSlotsMap = parseParkingString(defaultDataString);
      applyHighlightedSlots();
      fitView();
    });
  </script>
</body>
</html>
