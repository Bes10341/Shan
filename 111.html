<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香蕉工程師專屬庫存計算器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS 處理 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-amber-50 p-6 min-h-screen flex flex-col justify-between">
    <div class="max-w-xl w-full mx-auto bg-white p-6 rounded-2xl shadow-lg border border-amber-200">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-xl font-bold text-amber-900">🍌 香蕉工程師專屬庫存計算器</h1>
            <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">Banana Engineer</span>
        </div>
        <p class="text-sm text-gray-600 mb-4">自動計算 H 欄 (In) 與帶負號的 I 欄 (Out) 之總和 (In + Out)，精準不求人！</p>
        
        <input type="file" id="f" multiple class="mb-4 w-full border border-amber-300 p-3 rounded-xl bg-amber-50/30 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-white hover:file:bg-amber-600">
        
        <div id="out"></div>
    </div>

    <footer class="text-center text-xs text-amber-800/60 mt-6">
        Powered by 🍌 香蕉工程師 | All Rights Reserved
    </footer>

    <script>
        document.getElementById('f').addEventListener('change', (e) => {
            let res = document.getElementById('out');
            res.innerHTML = '<p class="text-center text-amber-600 py-4">🍌 香蕉工程師正在努力計算中...</p>';
            let files = e.target.files;
            let html = '<table class="w-full border border-gray-200 text-sm rounded-lg overflow-hidden"><tr class="bg-amber-100 text-amber-900"><th class="p-2 border border-amber-200 text-left">品項</th><th class="p-2 border border-amber-200 text-right">總數量</th></tr>';
            let count = 0;
            let aggregatedMap = {};
            
            Array.from(files).forEach(file => {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let data = new Uint8Array(e.target.result);
                    let wb = XLSX.read(data, {type: 'array'});
                    let rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                    
                    for(let i = 1; i < rows.length; i++){
                        let r = rows[i];
                        let t = r[2]; // Title 欄位
                        if(!t) continue;
                        let h = parseFloat(r[7]) || 0; // H 欄 In
                        let i_val = parseFloat(r[8]) || 0; // I 欄 Out (本身帶負號)
                        
                        // 累加計算 (In + Out，因為 Out 本身是負數)
                        aggregatedMap[t] = (aggregatedMap[t] || 0) + (h + i_val);
                    }
                    
                    count++;
                    if(count === files.length){
                        for(let [k, v] of Object.entries(aggregatedMap)){
                            html += `<tr><td class="p-2 border border-gray-200 text-left">${k}</td><td class="p-2 border border-gray-200 text-right font-semibold text-amber-800">${v.toLocaleString()}</td></tr>`;
                        }
                        html += '</table>';
                        res.innerHTML = html;
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        });
    </script>
</body>
</html>
